<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada LinkedIn</title>
<style>
  @font-face { font-family: "Sora"; font-weight: 400; src: url("fonts/sora-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Sora"; font-weight: 600; src: url("fonts/sora-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Sora"; font-weight: 700; src: url("fonts/sora-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Plex Mono"; font-weight: 400; src: url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Plex Mono"; font-weight: 500; src: url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }

  /* Tema oscuro (por defecto) */
  :root {
    --bg-a: #08131f;
    --bg-b: #0d2133;
    --glow: rgba(64, 140, 190, 0.22);
    --grid: rgba(150, 190, 225, 0.055);
    --ink: #f3f6f9;
    --muted: #8fa6ba;
    --edge: #2f5a78;
    --node: #6fb6dc;
    --node-ring: rgba(111, 182, 220, 0.25);
    --bar: rgba(111, 182, 220, 0.22);
    --bar-edge: rgba(111, 182, 220, 0.55);
    --accent: #f5b83d;
    --accent-soft: rgba(245, 184, 61, 0.16);
    --rule: rgba(143, 166, 186, 0.35);
  }
  /* Tema claro: banner.html?theme=light */
  :root[data-theme="light"] {
    --bg-a: #f6f3ec;
    --bg-b: #ebe6da;
    --glow: rgba(255, 255, 255, 0.7);
    --grid: rgba(14, 34, 51, 0.06);
    --ink: #0e2233;
    --muted: #4f6476;
    --edge: #9fb3c2;
    --node: #1f5f86;
    --node-ring: rgba(31, 95, 134, 0.18);
    --bar: rgba(31, 95, 134, 0.14);
    --bar-edge: rgba(31, 95, 134, 0.5);
    --accent: #c97a00;
    --accent-soft: rgba(201, 122, 0, 0.14);
    --rule: rgba(14, 34, 51, 0.25);
  }

  html, body { margin: 0; padding: 0; }
  body { background: var(--bg-a); }

  .banner {
    position: relative;
    width: 1584px;
    height: 396px;
    overflow: hidden;
    background:
      radial-gradient(620px 300px at 880px 200px, var(--glow), transparent 70%),
      linear-gradient(100deg, var(--bg-a) 0%, var(--bg-b) 55%, var(--bg-a) 100%);
    font-family: "Sora", sans-serif;
    color: var(--ink);
  }
  .banner::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 44px 44px;
    background-position: -1px -1px;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, rgba(0,0,0,.35) 45%, rgba(0,0,0,.35) 70%, #000 100%);
            mask-image: linear-gradient(90deg, #000 0%, rgba(0,0,0,.35) 45%, rgba(0,0,0,.35) 70%, #000 100%);
  }

  svg.art { position: absolute; inset: 0; }
  .label {
    font-family: "Plex Mono", monospace;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    fill: var(--muted);
  }

  .copy {
    position: absolute;
    left: 620px;
    top: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    font-family: "Plex Mono", monospace;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.22em;
    color: var(--accent);
    margin: 0 0 18px;
  }
  .headline {
    font-weight: 600;
    font-size: 44px;
    line-height: 1.12;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .headline em { font-style: normal; color: var(--accent); }
  .tags {
    display: flex;
    gap: 14px;
    align-items: center;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    font-size: 16px;
    color: var(--muted);
    width: max-content;
  }
  .tags i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); display: inline-block; }

  /* Vista previa con avatar y botón de edición simulados: banner.html?preview */
  .mock { display: none; }
  .preview .mock { display: block; }
  .mock-avatar {
    position: absolute; left: 50px; top: 206px;
    width: 317px; height: 317px; border-radius: 50%;
    background: #9aa4ad; border: 8px solid #fff; box-sizing: border-box;
  }
  .mock-pencil {
    position: absolute; left: 1478px; top: 40px;
    width: 60px; height: 60px; border-radius: 50%; background: #fff; opacity: .9;
  }
</style>
</head>
<body>
<div class="banner" id="banner">
  <svg class="art" width="1584" height="396" viewBox="0 0 1584 396" aria-hidden="true">
    <defs>
      <linearGradient id="trend" x1="1210" y1="0" x2="1470" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="var(--node)"/>
        <stop offset="1" stop-color="var(--accent)"/>
      </linearGradient>
    </defs>

    <!-- Red de suministro: proveedor → planta → CEDIS → cliente (arriba a la izquierda, fuera del área del avatar) -->
    <g fill="none" stroke="var(--edge)" stroke-width="1.5">
      <path d="M70 66 C150 66 160 112 236 112"/>
      <path d="M104 162 C170 162 170 112 236 112"/>
      <path d="M236 112 C300 112 310 74 380 74"/>
      <path d="M236 112 C300 112 330 178 410 178"/>
      <path d="M380 74 C450 74 460 124 530 124"/>
      <path d="M410 178 C470 178 470 124 530 124"/>
    </g>
    <!-- Paquetes en tránsito -->
    <g fill="var(--accent)">
      <circle cx="160" cy="84" r="3"/>
      <circle cx="304" cy="96" r="3"/>
      <circle cx="318" cy="150" r="3" opacity=".7"/>
      <circle cx="458" cy="94" r="3"/>
    </g>
    <!-- Nodos -->
    <g fill="var(--bg-a)" stroke="var(--node)" stroke-width="2">
      <circle cx="70" cy="66" r="11" fill="var(--node-ring)" stroke="none"/>
      <circle cx="70" cy="66" r="5"/>
      <circle cx="104" cy="162" r="5"/>
      <circle cx="236" cy="112" r="14" fill="var(--node-ring)" stroke="none"/>
      <rect x="229" y="105" width="14" height="14" rx="2"/>
      <circle cx="380" cy="74" r="11" fill="var(--node-ring)" stroke="none"/>
      <circle cx="380" cy="74" r="5"/>
      <circle cx="410" cy="178" r="5"/>
      <circle cx="530" cy="124" r="11" fill="var(--node-ring)" stroke="none"/>
      <circle cx="530" cy="124" r="5"/>
    </g>
    <text class="label" x="70" y="40" text-anchor="middle">PROVEEDOR</text>
    <text class="label" x="236" y="150" text-anchor="middle">PLANTA</text>
    <text class="label" x="380" y="48" text-anchor="middle">CEDIS</text>
    <text class="label" x="530" y="158" text-anchor="middle">CLIENTE</text>

    <!-- Analítica: demanda real (barras) y pronóstico (línea punteada con banda) -->
    <g transform="translate(14,0)">
      <line x1="1196" y1="306" x2="1476" y2="306" stroke="var(--rule)" stroke-width="1"/>
      <g fill="var(--bar)" stroke="var(--bar-edge)" stroke-width="1">
        <rect x="1206" y="252" width="20" height="54" rx="2"/>
        <rect x="1236" y="232" width="20" height="74" rx="2"/>
        <rect x="1266" y="242" width="20" height="64" rx="2"/>
        <rect x="1296" y="214" width="20" height="92" rx="2"/>
        <rect x="1326" y="198" width="20" height="108" rx="2"/>
        <rect x="1356" y="206" width="20" height="100" rx="2"/>
      </g>
      <!-- Banda de confianza del pronóstico -->
      <path d="M1366 200 L1396 176 L1426 158 L1456 136 L1456 176 L1426 192 L1396 206 L1366 214 Z" fill="var(--accent-soft)"/>
      <!-- Línea real -->
      <polyline points="1216,246 1246,226 1276,236 1306,208 1336,192 1366,200" fill="none" stroke="url(#trend)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Pronóstico -->
      <polyline points="1366,200 1396,190 1426,174 1456,156" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>
      <g fill="var(--bg-a)" stroke="var(--node)" stroke-width="2">
        <circle cx="1216" cy="246" r="3.5"/>
        <circle cx="1246" cy="226" r="3.5"/>
        <circle cx="1276" cy="236" r="3.5"/>
        <circle cx="1306" cy="208" r="3.5"/>
        <circle cx="1336" cy="192" r="3.5"/>
      </g>
      <circle cx="1366" cy="200" r="4" fill="var(--bg-a)" stroke="var(--accent)" stroke-width="2"/>
      <circle cx="1456" cy="156" r="12" fill="var(--accent-soft)"/>
      <circle cx="1456" cy="156" r="5" fill="var(--accent)"/>
      <line x1="1381" y1="120" x2="1381" y2="306" stroke="var(--rule)" stroke-dasharray="2 4"/>
      <text class="label" x="1286" y="332" text-anchor="middle">REAL</text>
      <text class="label" x="1426" y="332" text-anchor="middle">PRONÓSTICO</text>
    </g>
  </svg>

  <div class="copy">
    <p class="eyebrow">SUPPLY CHAIN &amp; DATA ANALYTICS</p>
    <h1 class="headline"><em>Datos</em> que mueven<br>la cadena de suministro.</h1>
    <div class="tags">
      <span>Automatización</span><i></i>
      <span>Mejora continua</span><i></i>
      <span>KPIs &amp; Dashboards</span>
    </div>
  </div>

  <div class="mock mock-avatar"></div>
  <div class="mock mock-pencil"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("theme") === "light") document.documentElement.dataset.theme = "light";
  if (q.has("preview")) document.getElementById("banner").classList.add("preview");
</script>
</body>
</html>
